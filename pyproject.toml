[project]
name = "python-scripts"
version = "0.1.0"
description = "Collection of reusable Python scripts with a single dispatcher (main.py)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openrouter>=1.1.126",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
